{% load static %}
{% comment %}
   Modal d'abonnement à la newsletter — à inclure dans les pages blog
{% endcomment %}

<div id="newsletter-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50" aria-labelledby="newsletter-modal-title" role="dialog">
  <div class="bg-bg-surface rounded-2xl p-6 md:p-8 max-w-md w-full mx-4 shadow-xl">
    <h3 id="newsletter-modal-title" class="font-script text-2xl text-text-heading mb-2 text-center">Rejoignez la communauté</h3>
    <p class="text-sm text-text-muted text-center mb-6">Recevez mes nouveaux articles et actualités.</p>
    <form id="newsletter-cta-form" class="space-y-4">
      {% csrf_token %}
      <input type="text" name="name" placeholder="Votre nom / pseudo" maxlength="100" required
             class="w-full px-4 py-3 rounded-xl bg-bg-soft border border-border-subtle text-text-main text-sm placeholder-text-muted focus:outline-none focus:border-accent transition" />
      <input type="email" name="email" placeholder="Votre adresse email" required
             class="w-full px-4 py-3 rounded-xl bg-bg-soft border border-border-subtle text-text-main text-sm placeholder-text-muted focus:outline-none focus:border-accent transition" />
      <div class="flex gap-3">
        <button type="submit" id="newsletter-modal-submit"
                class="flex-1 px-6 py-3 bg-accent text-bg-surface rounded-full text-sm font-medium hover:bg-accent-dark transition shadow-md">
          S'abonner
        </button>
        <button type="button" id="newsletter-modal-close"
                class="px-4 py-3 text-text-muted hover:text-text-main transition text-sm">
          Annuler
        </button>
      </div>
    </form>
    <p id="newsletter-modal-error" class="hidden text-red-500 text-sm text-center mt-3"></p>
    <p id="newsletter-modal-success" class="hidden text-green-500 text-sm text-center mt-3"></p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const newsletterModal = document.getElementById('newsletter-modal');
  const newsletterForm = document.getElementById('newsletter-cta-form');
  const newsletterError = document.getElementById('newsletter-modal-error');
  const newsletterSuccess = document.getElementById('newsletter-modal-success');
  const newsletterSubmitBtn = document.getElementById('newsletter-modal-submit');
  const newsletterCloseBtn = document.getElementById('newsletter-modal-close');
  const newsletterCtaBtns = document.querySelectorAll('.newsletter-cta-btn');

  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  newsletterCtaBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      newsletterModal.classList.remove('hidden');
    });
  });

  if (newsletterCloseBtn) {
    newsletterCloseBtn.addEventListener('click', function() {
      newsletterModal.classList.add('hidden');
    });
  }

  if (newsletterModal) {
    newsletterModal.addEventListener('click', function(e) {
      if (e.target === newsletterModal) {
        newsletterModal.classList.add('hidden');
      }
    });
  }

  if (newsletterForm) {
    newsletterForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      newsletterError.classList.add('hidden');
      newsletterSuccess.classList.add('hidden');
      newsletterSubmitBtn.disabled = true;
      newsletterSubmitBtn.textContent = 'Envoi...';

      const formData = new FormData(newsletterForm);

      try {
        const response = await fetch('{% url "subscribe_newsletter" %}', {
          method: 'POST',
          body: formData,
          headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });

        const data = await response.json();

        if (data.success) {
          newsletterSuccess.textContent = '✓ Email de confirmation envoyé ! Vérifiez votre boîte de réception.';
          newsletterSuccess.classList.remove('hidden');
          newsletterForm.reset();
          setTimeout(() => {
            newsletterModal.classList.add('hidden');
          }, 3000);
        } else {
          newsletterError.textContent = data.error || 'Erreur lors de l\'inscription';
          newsletterError.classList.remove('hidden');
        }
      } catch (error) {
        newsletterError.textContent = 'Erreur lors de l\'inscription';
        newsletterError.classList.remove('hidden');
      } finally {
        newsletterSubmitBtn.disabled = false;
        newsletterSubmitBtn.textContent = 'S\'abonner';
      }
    });
  }
});
</script>
