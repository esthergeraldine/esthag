{% load static %}
<a href="#top"
   id="scroll-to-top"
   class="fixed bottom-24 right-6 w-12 h-12 rounded-full bg-accent-dark text-bg-surface shadow-lg shadow-accent-dark/30 flex items-center justify-center opacity-0 invisible translate-y-4 transition-all duration-300 hover:bg-accent hover:scale-110 z-50"
   aria-label="Retour en haut">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
  </svg>
</a>

<script>
  (function() {
    const btn = document.getElementById('scroll-to-top');
    if (!btn) return;

    window.addEventListener('scroll', function() {
      if (window.scrollY > 400) {
        btn.classList.remove('opacity-0', 'invisible', 'translate-y-4');
        btn.classList.add('opacity-100', 'visible', 'translate-y-0');
      } else {
        btn.classList.add('opacity-0', 'invisible', 'translate-y-4');
        btn.classList.remove('opacity-100', 'visible', 'translate-y-0');
      }
    });

    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>
